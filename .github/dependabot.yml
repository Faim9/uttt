# Weekly pull requests for dependency updates; security fixes arrive as soon as they're published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ['*']
    ignore:
      # Pinned to 6.x until typescript-eslint supports TypeScript 7 (see CLAUDE.md).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    ignore:
      # A new Node.js major (e.g. 22 → 24) is a deliberate upgrade, tested first, not a weekly bump.
      - dependency-name: node
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
