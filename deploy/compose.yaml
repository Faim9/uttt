# Production: run `docker compose up -d --build` from this folder. See docs/deploy.md.
#
# restore: on first start, fetches the latest backup if there is no database yet.
# app:     the site (web + API) on port 3000, reachable only inside this network.
# house-bot: an always-online bot in the bot pools (packages/server/src/house-bot.ts); off without a token.
# backup:  streams every database change to cloud storage (Litestream).
# tunnel:  connects to Cloudflare, which serves https://uttt.org; no ports are opened on the server.
#
# The `z` on mounted files lets containers read them where SELinux is on (Fedora); elsewhere it does nothing.

# Rotated logs: at most 3 × 10 MB per service.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

x-litestream: &litestream
  image: docker.io/litestream/litestream:0.5.17
  logging: *logging
  user: '1000:1000'
  env_file: .env
  volumes:
    - ./data:/data:z
    - ./litestream.yml:/etc/litestream.yml:ro,z

services:
  restore:
    <<: *litestream
    command: restore -if-db-not-exists -if-replica-exists /data/uttt.db

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    logging: *logging
    env_file: .env
    volumes:
      - ./data:/data:z
    depends_on:
      restore:
        condition: service_completed_successfully

  house-bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ['node', 'packages/server/src/house-bot.ts']
    restart: on-failure
    logging: *logging
    environment:
      UTTT_URL: ws://app:3000/ws
      HOUSE_BOT_TOKEN: ${HOUSE_BOT_TOKEN:-}
    # The engine thinks hard; one core stays free for the site.
    cpus: 1
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  backup:
    <<: *litestream
    command: replicate
    restart: unless-stopped
    depends_on:
      - app

  tunnel:
    image: docker.io/cloudflare/cloudflared:2026.9.3
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    logging: *logging
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
