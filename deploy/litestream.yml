# Continuous backup of the database to S3-compatible storage (Cloudflare R2). Values come from .env.

# Any moment in the last 7 days can be restored. Older backups are deleted, so data from deleted
# accounts is gone from backups within a week (the privacy policy promises this).
snapshot:
  interval: 24h
  retention: 168h

dbs:
  - path: /data/uttt.db
    replica:
      type: s3
      bucket: ${BACKUP_BUCKET}
      path: uttt
      endpoint: ${BACKUP_ENDPOINT}
      region: auto
      access-key-id: ${BACKUP_ACCESS_KEY_ID}
      secret-access-key: ${BACKUP_SECRET_ACCESS_KEY}
